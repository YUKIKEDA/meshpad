[package]
name = "meshpad"
version = "0.1.0"
edition = "2021"
description = "Lightweight STL/NAS 3D viewer"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.32"
fast-float2 = "0.2"
glam = { version = "0.30", features = ["bytemuck"] }
memmap2 = "0.9"
rayon = "1.11"
rfd = "0.17"
wgpu = { version = "25", default-features = true }

[dev-dependencies]
pollster = "0.4"
stl_io = "0.11"

[[bench]]
name = "stl_parse"
harness = false

[profile.release]
lto = true
codegen-units = 1
